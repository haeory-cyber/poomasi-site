<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>품앗이 로컬푸드 | 임박·못난이·과잉 통합관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    /* ===== 기본 리셋 & 폰트 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background: #FAFAF5;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 레이아웃 ===== */
    .app-layout {
      display: flex;
      flex: 1;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== 사이드바 ===== */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: #1B5E20;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 22px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .sidebar-logo-title {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }
    .sidebar-logo-sub {
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      margin-top: 3px;
    }
    .sidebar-nav {
      flex: 1;
      padding: 12px 0;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
      user-select: none;
    }
    .nav-item:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .nav-item.active {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-left-color: #A5D6A7;
      font-weight: 700;
    }
    .nav-icon { font-size: 18px; flex-shrink: 0; }
    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.45);
      font-size: 11px;
      line-height: 1.6;
    }

    /* ===== 메인 영역 ===== */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-header {
      background: #fff;
      border-bottom: 1px solid #E8E8E0;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #1B5E20;
    }
    .header-sub {
      font-size: 13px;
      color: #888;
    }
    .header-date {
      font-size: 13px;
      color: #555;
      background: #F0F7F0;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 600;
    }
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px 32px;
    }

    /* ===== 콘텐츠 페이드 애니메이션 ===== */
    #content-area {
      transition: opacity 0.15s ease;
    }
    .fade-out { opacity: 0; }
    .fade-in { opacity: 1; }

    /* ===== 섹션 헤더 ===== */
    .section-header {
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .section-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: #1B5E20;
    }
    .section-sub {
      font-size: 13px;
      color: #888;
    }

    /* ===== KPI 카드 ===== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 1px solid #EFEFE8;
    }
    .kpi-icon { font-size: 28px; line-height: 1; margin-top: 2px; }
    .kpi-body { flex: 1; }
    .kpi-label { font-size: 12px; color: #888; font-weight: 500; margin-bottom: 4px; }
    .kpi-value { font-size: 24px; font-weight: 800; color: #1A1A1A; line-height: 1.2; }
    .kpi-delta { font-size: 12px; margin-top: 4px; }
    .delta-up { color: #2E7D32; font-weight: 600; }
    .delta-neutral { color: #888; }
    .delta-down { color: #C62828; }

    .kpi-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi-card-sm {
      background: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 1px solid #EFEFE8;
    }

    /* ===== 차트 행 ===== */
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 1px solid #EFEFE8;
      height: 280px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chart-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .chart-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    /* ===== 테이블 카드 ===== */
    .table-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 1px solid #EFEFE8;
      overflow: hidden;
    }
    .table-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid #F0F0E8;
    }
    .table-title { font-size: 14px; font-weight: 700; color: #333; }
    .table-sub { font-size: 12px; color: #999; }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table thead tr {
      background: #F8FAF8;
      border-bottom: 1px solid #ECECE4;
    }
    .data-table th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      color: #555;
      font-size: 12px;
      white-space: nowrap;
    }
    .data-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #F4F4EE;
      color: #333;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover { background: #FAFFF8; }
    .log-time { color: #888; font-size: 12px; white-space: nowrap; }
    .price-discounted { color: #1B5E20; font-weight: 700; }

    /* ===== 배지 ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-success { background: #E8F5E9; color: #2E7D32; }
    .badge-warning { background: #FFF8E1; color: #F57C00; }
    .badge-danger  { background: #FFEBEE; color: #C62828; }
    .badge-neutral { background: #F5F5F5; color: #666; }
    .badge-info    { background: #E3F2FD; color: #1565C0; }

    /* ===== 할인·일수 배지 ===== */
    .discount-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: #BF6A1F;
      color: #fff;
    }
    .day-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .day-1 { background: #FFF3E0; color: #E65100; }
    .day-2 { background: #FFF8E1; color: #F57C00; }
    .day-3 { background: #FFEBEE; color: #C62828; }

    /* ===== 요약 바 ===== */
    .summary-bar {
      background: #F0F7F0;
      border: 1px solid #C8E6C9;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      color: #2E7D32;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .summary-icon { font-size: 15px; }

    /* ===== 필터 바 ===== */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid #DDD;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-btn:hover { border-color: #1B5E20; color: #1B5E20; }
    .filter-btn.active {
      background: #1B5E20;
      border-color: #1B5E20;
      color: #fff;
    }
    .filter-count {
      background: rgba(0,0,0,0.12);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
    }
    .filter-btn.active .filter-count { background: rgba(255,255,255,0.25); }

    /* ===== 할인 룰 카드 ===== */
    .discount-rule-card {
      margin-top: 12px;
      background: #fff;
      border-radius: 10px;
      padding: 12px 18px;
      border: 1px solid #EFEFE8;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .rule-title { font-weight: 700; color: #555; }

    /* ===== 2분할 카드 ===== */
    .two-col-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    .stat-card {
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .stat-card-primary { background: #E8F5E9; border: 1px solid #C8E6C9; }
    .stat-card-accent  { background: #FFF3E0; border: 1px solid #FFE0B2; }
    .stat-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 14px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-row span { color: #666; }
    .stat-row strong { font-size: 16px; }
    .text-success { color: #2E7D32; }
    .text-warning { color: #F57C00; }
    .text-danger  { color: #C62828; }

    /* ===== 버튼 ===== */
    .btn-primary {
      background: #1B5E20;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #2E7D32; }
    .btn-secondary {
      background: #fff;
      color: #555;
      border: 1.5px solid #DDD;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ===== 모달 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: #1B5E20;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }
    .form-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #DDD;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: #1B5E20; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ===== 알림 이력 ===== */
    .notify-history { padding: 8px 0; }
    .notify-history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid #F4F4EE;
      font-size: 13px;
    }
    .notify-history-item:last-child { border-bottom: none; }
    .notify-msg { flex: 1; color: #333; }
    .notify-recipients { color: #888; font-size: 12px; white-space: nowrap; }

    /* ===== 2컬럼 레이아웃 ===== */
    .two-col-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ===== 스크롤바 ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CCC; border-radius: 3px; }

    /* ===== 반응형 (1024px 이하) ===== */
    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 1024px) {
      .sidebar { width: 190px; min-width: 190px; }
      .chart-row { grid-template-columns: 1fr; }
      .two-col-layout { grid-template-columns: 1fr; }
      .two-col-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-title">품앗이 로컬푸드</div>
        <div class="sidebar-logo-sub">임박·못난이·과잉 통합관리</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
          <span class="nav-icon">📊</span>대시보드
        </div>
        <div class="nav-item" data-tab="imminent" onclick="switchTab('imminent')">
          <span class="nav-icon">⏰</span>임박 관리
        </div>
        <div class="nav-item" data-tab="ugly" onclick="switchTab('ugly')">
          <span class="nav-icon">🥕</span>못난이·과잉
        </div>
        <div class="nav-item" data-tab="notify" onclick="switchTab('notify')">
          <span class="nav-icon">🔔</span>알림·예약
        </div>
        <div class="nav-item" data-tab="farm" onclick="switchTab('farm')">
          <span class="nav-icon">🌾</span>농가 환류
        </div>
      </nav>
      <div class="sidebar-footer">
        품앗이소비자생활협동조합<br>지족점<br>푸드플랜 효과 실증사업 2026
      </div>
    </aside>

    <!-- 메인 -->
    <div class="main-area">
      <header class="top-header">
        <div>
          <div class="header-title">품앗이 로컬푸드 | 임박·못난이·과잉 통합관리</div>
          <div class="header-sub">푸드플랜 효과 실증사업 운영 대시보드</div>
        </div>
        <div class="header-date" id="today-date"></div>
      </header>
      <div class="content-scroll">
        <div id="content-area"></div>
      </div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
